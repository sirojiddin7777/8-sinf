<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aloqa</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.contact-box{
background:rgba(255,255,255,0.08);
padding:40px;
border-radius:20px;
width:350px;
text-align:center;
box-shadow:0 0 25px rgba(0,255,255,0.4);
}

.contact-box h2{
margin-bottom:20px;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
outline:none;
font-size:14px;
}

textarea{
height:100px;
resize:none;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#ff4b2b;
border:none;
border-radius:8px;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#ff2a00;
}

.back{
display:inline-block;
margin-top:20px;
color:white;
text-decoration:none;
}

</style>
</head>

<body>

<div class="contact-box">

<h2>📞 Bog‘lanish</h2>

<input type="text" id="name" placeholder="Ismingiz">

<input type="text" id="phone" placeholder="Telefon raqamingiz">

<textarea id="message" placeholder="Xabaringizni yozing..."></textarea>

<button onclick="sendMessage()">Yuborish</button>

<a href="index.html" class="back">⬅ Bosh sahifaga qaytish</a>

</div>

<script>

function sendMessage(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let message=document.getElementById("message").value;

let token="8467269941:AAEZGMWtAeISMElXZ457noguOwpi6ju8_qE";
let chat_id="7960027462";

let text=`📩 Yangi xabar
Ism: ${name}
Telefon: ${phone}
Xabar: ${message}`;

fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
chat_id:chat_id,
text:text
})
})

alert("Xabar yuborildi!");

}

</script>

</body>
</html>
