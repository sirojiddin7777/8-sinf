<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aloqa</title>

<style>

body{
font-family:Segoe UI;
background:#0f2027;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.form-box{
background:#1f3a4a;
padding:40px;
border-radius:15px;
width:320px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#ff4b2b;
border:none;
border-radius:8px;
color:white;
font-size:16px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="form-box">

<h2>📞 Bog‘lanish</h2>

<input type="text" id="name" placeholder="Ismingiz">
<input type="text" id="phone" placeholder="Telefon raqamingiz">

<button onclick="sendMessage()">Yuborish</button>

</div>

<script>

function sendMessage(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;

let token="8467269941:AAEZGMWtAeISMElXZ457noguOwpi6ju8_qE";
let chat_id="7960027462";

let message=`Yangi aloqa:\nIsm: ${name}\nTelefon: ${phone}`;

fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
chat_id:chat_id,
text:message
})
})

alert("Xabar yuborildi!");

}

</script>

</body>
</html>
