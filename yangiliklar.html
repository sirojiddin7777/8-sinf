<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8-sinf Yangiliklar</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#000);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
color:white;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

header{
text-align:center;
padding:60px 20px;
}

header h1{
font-size:48px;
}

/* YANGILIK KARTASI */

.news-card{
width:700px;
margin:60px auto;
background:rgba(255,255,255,0.08);
border-radius:20px;
overflow:hidden;
backdrop-filter:blur(10px);
box-shadow:0 0 25px rgba(0,255,255,0.4);
}

.news-image{
position:relative;
}

.news-image img{
width:100%;
height:350px;
object-fit:cover;
}

.prev,.next{
position:absolute;
top:50%;
transform:translateY(-50%);
background:rgba(0,0,0,0.5);
border:none;
color:white;
font-size:30px;
padding:10px 15px;
cursor:pointer;
}

.prev{left:10px;}
.next{right:10px;}

.news-text{
padding:25px;
}

.news-text h2{
margin:0;
font-size:28px;
}

.news-text p{
font-size:18px;
line-height:1.6;
}

/* BACK BUTTON */

.back{
display:block;
width:250px;
margin:50px auto;
text-align:center;
padding:15px;
background:linear-gradient(45deg,#ff416c,#ff4b2b);
border-radius:40px;
color:white;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<header>
<h1>📰 8-sinf Yangiliklar</h1>
</header>

<!-- YANGILIK -->

<div class="news-card">

<div class="news-image">
<img id="newsImg" src="rasm1.jpg">
<button class="prev" onclick="prevImg()">❮</button>
<button class="next" onclick="nextImg()">❯</button>
</div>

<div class="news-text">
<h2>O‘zbek tili tadbiri</h2>
<p>
8-sinf o‘quvchilari o‘zbek tili fanidan tadbir o‘tkazdi.
Tadbir juda qiziqarli va faol o‘tdi.
</p>
</div>

</div>

<a href="index.html" class="back">⬅ Bosh sahifaga qaytish</a>

<script>

const images=[
"rasm1.jpg",
"rasm2.jpg",
"rasm3.jpg"
];

let current=0;

function nextImg(){
current++;
if(current>=images.length){
current=0;
}
document.getElementById("newsImg").src=images[current];
}

function prevImg(){
current--;
if(current<0){
current=images.length-1;
}
document.getElementById("newsImg").src=images[current];
}

</script>

</body>
</html>
